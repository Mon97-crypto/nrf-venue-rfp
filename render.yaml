services:
  - type: web
    name: nrf-venue-rfp
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: PORT
        value: 10000

      # Nothing is sent by this app — "Send RFP" opens a prefilled Gmail
      # compose window, so the mail leaves the sender's own mailbox. No API
      # key and no verified sending domain are needed.

      - key: RFP_SENDER_ORG
        value: "Impact Analytics"

      # The Google account the compose window opens under. Defaults to
      # sending_account in venue_rfp/data/senders.json.
      # - key: GMAIL_SENDING_ACCOUNT
      #   value: "maggie.dryden@impactanalytics.ai"

      # Outreach tracker (SQLite). On the free plan there is no persistent
      # disk, so the container filesystem — and this file with it — is wiped on
      # every restart and spin-down. The board mirrors what it knows into the
      # browser and pushes it back on load, which covers the common case, but
      # that copy lives in one browser on one machine.
      #
      # For state that survives on the server, switch `plan: free` to
      # `plan: starter` above, then uncomment both this and the `disk:` block.
      # - key: VENUE_DB_PATH
      #   value: /var/data/outreach.db

    # Requires a paid instance type (Starter+). Free web services cannot
    # attach a disk.
    # disk:
    #   name: venue-tracker
    #   mountPath: /var/data
    #   sizeGB: 1
