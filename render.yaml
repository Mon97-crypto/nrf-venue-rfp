services:
  - type: web
    name: nrf-venue-rfp
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: PORT
        value: 10000

      # Nothing is sent by this app — "Send RFP" opens a prefilled Gmail
      # compose window, so the mail leaves the sender's own mailbox. No API
      # key and no verified sending domain are needed.

      - key: RFP_SENDER_ORG
        value: "Impact Analytics"

      # Set only if the sender keeps several Google accounts signed in and the
      # compose window opens under the wrong one (0 is the first account).
      # - key: GMAIL_ACCOUNT_INDEX
      #   value: "0"
      # - key: RFP_SENDER_PHONE
      #   value: "+1 555 0100"

      # Outreach tracker (SQLite). Free instances cannot mount a disk, so this
      # resets on redeploy and spin-down — use the "Export tracker" button, or
      # move to a paid instance and uncomment this and the `disk:` block.
      # - key: VENUE_DB_PATH
      #   value: /var/data/outreach.db

    # Requires a paid instance type (Starter+). Free web services cannot
    # attach a disk.
    # disk:
    #   name: venue-tracker
    #   mountPath: /var/data
    #   sizeGB: 1
